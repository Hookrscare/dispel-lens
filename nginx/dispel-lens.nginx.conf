# ==============================================================================
# NGINX Configuration for Dispel Lens (lens.dispel.cloud)
# Supports WebSocket Streaming (wss://), HTTP/2 SSL Termination, and API Routing
# ==============================================================================

# Rate limiting zone (100 req/min per IP)
limit_req_zone $binary_remote_addr zone=dispel_api_limit:10m rate=100r/m;

upstream dispel_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name lens.dispel.cloud;
    return 301 https://$host$request_uri;
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lens.dispel.cloud;

    # SSL Certificates (Let's Encrypt / Cloudflare)
    ssl_certificate /etc/letsencrypt/live/lens.dispel.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lens.dispel.cloud/privkey.pem;

    # Modern SSL Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max burst upload size (for video frames and audio track samples)
    client_max_body_size 50M;

    # Real-Time WebSocket Streaming Endpoint (/ws/detect-stream)
    location /ws/detect-stream {
        proxy_pass http://dispel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout adjustments (keep streaming channels open)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API Endpoints (/api/v1/)
    location /api/v1/ {
        limit_req zone=dispel_api_limit burst=20 nodelay;

        proxy_pass http://dispel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy deep-tier inference
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Dispel Lens Web Portal & Global Trust Registry (/demo or /)
    location / {
        proxy_pass http://dispel_backend/demo/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
