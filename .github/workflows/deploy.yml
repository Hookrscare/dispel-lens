name: Dispel Lens CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit & Integration Tests
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v

  package-extension:
    name: Package Chrome Extension (MV3)
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Package Extension Archive
        run: |
          zip -r dispel-lens-extension-v1.0.0.zip extension/ \
            -x "*.DS_Store" \
            -x "*__pycache__*" \
            -x "*.git*"

      - name: Upload Extension ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dispel-lens-extension-v1.0.0
          path: dispel-lens-extension-v1.0.0.zip
          retention-days: 30

  build-and-deploy-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-verify
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: dispelcloud/dispel-lens-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
